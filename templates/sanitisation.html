<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperial Terminal — Sanitisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ==========================================
     CUSTOM FONTS (Fontspring DEMO Integral CF)
     ========================================== */
  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-regular.otf') }}") format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-bold.otf') }}") format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-extrabold.otf') }}") format('opentype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-heavy.otf') }}") format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --red-glow: #ff0000;
    --black: #000000;
    --panel-border: #800000;
    --text-red: #e60000;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    font-family: 'IntegralCF', 'Orbitron', 'JetBrains Mono', sans-serif;
    min-height: 100vh;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
  }

  /* ==========================================
     NAVBAR
     ========================================== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--panel-border);
    padding: 12px 24px;
    background: #030303;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-logo {
    width: 24px;
    height: 24px;
    filter: drop-shadow(0 0 4px var(--red-glow));
  }

  .nav-brand-text {
    display: flex;
    flex-direction: column;
  }

  .nav-title {
    color: var(--text-red);
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .nav-status {
    color: var(--text-red);
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.8;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    background: var(--text-red);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--red-glow);
  }

  .nav-links {
    display: flex;
    gap: 48px;
  }

  .nav-links a {
    color: var(--text-red);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: color 0.2s, text-shadow 0.2s;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #ff3333;
    text-shadow: 0 0 8px var(--red-glow);
  }

  /* ==========================================
     BOTTOM ACTION ROW
     ========================================== */
  .bottom-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    width: 100%;
    padding-bottom: 12px;
  }

  .page-title {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--white);
    text-transform: uppercase;
    line-height: 1;
  }

  .action-buttons {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 14px 36px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s, box-shadow 0.2s;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-organize {
    background: #000000;
    border: 1px solid #333333;
    color: var(--white);
  }

  .btn-organize:hover {
    border-color: #666666;
  }

  .btn-announce {
    background: var(--text-red);
    border: none;
    color: var(--black);
    font-weight: 800;
    box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
  }

  .btn-announce:hover {
    background: #ff1a1a;
    box-shadow: 0 0 18px var(--red-glow);
  }
</style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <div class="navbar">
    <div class="nav-brand">
      <svg class="nav-logo" viewBox="0 0 100 100" fill="var(--text-red)">
        <path d="M50 0 L60 35 L95 35 L67 55 L78 90 L50 70 L22 90 L33 55 L5 35 L40 35 Z"/>
      </svg>
      <div class="nav-brand-text">
        <span class="nav-title">Imperial Network Command Centre</span>
        <span class="nav-status"><span class="status-dot"></span> active</span>
      </div>
    </div>

    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('announcements') }}" class="active">Announcements</a>
      <a href="{{ url_for('supplies') }}">Supplies</a>
      <a href="{{ url_for('sanitisation') }}">Sanitisation</a>
    </div>
  </div>

  <!-- BOTTOM BAR WITH TITLE & BUTTONS -->
  <div class="bottom-bar">
    <h1 class="page-title">SELECT A PLANET</h1>

    <div class="action-buttons">
      <button class="btn btn-organize">Organize</button>
      <button class="btn btn-announce">Announce</button>
    </div>
  </div>

</body>
</html>
