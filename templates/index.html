<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='crt.css') }}">

<style>
  /* ==========================================
     CUSTOM FONTS (Fontspring DEMO Integral CF)
     ========================================== */
  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-regular.otf') }}") format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-bold.otf') }}") format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-extrabold.otf') }}") format('opentype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IntegralCF';
    src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-heavy.otf') }}") format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --red-glow: #ff0000;
    --red-bright: #ff3333;
    --text-red: #e60000;
    --panel-border: #800000;
    --white: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'IntegralCF', 'Orbitron', 'JetBrains Mono', sans-serif;
  }

  #stage, #fluid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
  }

  #stage { z-index: 1; }
  #fluid { z-index: 10; pointer-events: none; display: none; }

  /* Preloader */
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    z-index: 100;
    pointer-events: none;
    letter-spacing: 2px;
  }

  /* ==========================================
     UI OVERLAY (NAVIGATION & BOTTOM LEFT TEXT)
     ========================================== */
  .ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 20;
    pointer-events: none;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    justify-space: space-between;
  }

  /* TOP NAVBAR */
  .navbar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--panel-border);
    padding: 10px 20px;
    background: rgba(2, 2, 2, 0.85);
    backdrop-filter: blur(4px);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-logo {
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 0 4px var(--red-glow));
  }

  .nav-brand-text {
    display: flex;
    flex-direction: column;
  }

  .nav-title {
    color: var(--text-red);
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .nav-status {
    color: var(--text-red);
    font-size: 9px;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.8;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    background: var(--text-red);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--red-glow);
  }

  .nav-links {
    display: flex;
    gap: 40px;
  }

  .nav-links a {
    color: var(--text-red);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color 0.2s, text-shadow 0.2s;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--red-bright);
    text-shadow: 0 0 8px var(--red-glow);
  }

  /* BOTTOM LEFT HEADER OVERLAY */
  .bottom-left-header {
    pointer-events: auto;
    position: absolute;
    bottom: 28px;
    left: 28px;
    display: flex;
    flex-direction: column;
    line-height: 0.95;
    user-select: none;
  }

  .bottom-left-header .inc-text {
    font-size: clamp(1.8rem, 3.5vw, 3.2rem);
    font-weight: 900;
    color: #e60000;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
  }

  .bottom-left-header .protocol-text {
    font-size: clamp(1.1rem, 2.2vw, 2.0rem);
    font-weight: 400;
    color: #ffffff;
    letter-spacing: 2px;
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
</head>
<body>

  <!-- CRT OVERLAY -->
  <div id="loader">Loading... 0%</div>
<canvas id="stage"></canvas>
<canvas id="fluid"></canvas>

<!-- UI OVERLAY -->
<div class="ui-overlay">
  <!-- TOP NAVBAR -->
  <div class="navbar">
    <div class="nav-brand">
      <svg class="nav-logo" viewBox="0 0 100 100" fill="var(--text-red)">
        <path d="M50 0 L60 35 L95 35 L67 55 L78 90 L50 70 L22 90 L33 55 L5 35 L40 35 Z"/>
      </svg>
      <div class="nav-brand-text">
        <span class="nav-title">Imperial Network Command Centre</span>
        <span class="nav-status"><span class="status-dot"></span> active</span>
      </div>
    </div>

    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="active">Home</a>
      <a href="{{ url_for('announcements') }}">Announcements</a>
      <a href="{{ url_for('supplies') }}">Supplies</a>
      <a href="{{ url_for('sanitisation') }}">Sanitisation</a>
      <a href="{{ url_for('vader') }}">Vader</a>
    </div>
  </div>

  <!-- BOTTOM LEFT HEADING -->
  <div class="bottom-left-header">
    <span class="inc-text">INCC</span>
    <span class="protocol-text">PROTOCOL</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
  "use strict";

  /* =========================================================================
     SECTION 1: HARDCODED STYLE CONFIGURATION
     ========================================================================= */
  const styleSettings = {
    borderColorHex: "#ff0000",
    borderOpacity: 0.55,
    borderWidth: 5,
    glowRadius: 17,
    cellSize: 12,
    threshold: 0.50
  };

  const EXTRACTION_FPS = 15;
  const stageCanvas = document.getElementById("stage");
  const stageCtx = stageCanvas.getContext("2d");
  const fluidCanvas = document.getElementById("fluid");
  const loader = document.getElementById("loader");

  const maskCanvas = document.createElement("canvas");
  const maskCtx = maskCanvas.getContext("2d");

  const glowCanvas = document.createElement("canvas");
  const glowCtx = glowCanvas.getContext("2d");

  let framesInside = [];
  let framesOutside = [];
  let targetProgress = 0;
  let currentProgress = 0;
  let loadedCount = 0;
  let totalFramesEstimate = 1;

  function hexToRgba(hex, alpha) {
    let c = hex.replace("#", "");
    if (c.length === 3) c = c.split("").map(x => x + x).join("");
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
  }

  function resizeAllCanvases() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth * dpr;
    const h = window.innerHeight * dpr;

    [stageCanvas, maskCanvas, glowCanvas].forEach(c => {
      c.width = w;
      c.height = h;
    });

    if (window.fluidSim) {
      window.fluidSim._resize();
    }
  }
  window.addEventListener("resize", resizeAllCanvases);

  function extractFrames(src) {
    return new Promise((resolve, reject) => {
      const video = document.createElement("video");
      video.src = src;
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      video.onloadedmetadata = async () => {
        const duration = video.duration;
        const total = Math.floor(duration * EXTRACTION_FPS);
        const frames = [];

        const scale = 0.75;
        const offscreen = document.createElement("canvas");
        offscreen.width = (video.videoWidth || 1280) * scale;
        offscreen.height = (video.videoHeight || 720) * scale;
        const offCtx = offscreen.getContext("2d");

        for (let i = 0; i < total; i++) {
          video.currentTime = i / EXTRACTION_FPS;
          await new Promise((r) => { video.onseeked = r; });

          offCtx.drawImage(video, 0, 0, offscreen.width, offscreen.height);
          const bitmap = await createImageBitmap(offscreen);
          frames.push(bitmap);

          loadedCount++;
          const percent = Math.min(Math.round((loadedCount / totalFramesEstimate) * 100), 100);
          loader.textContent = `Loading... ${percent}%`;
        }
        resolve(frames);
      };

      video.onerror = reject;
    });
  }

  function drawImageCover(ctx, img, canvasWidth, canvasHeight) {
    const imgRatio = img.width / img.height;
    const canvasRatio = canvasWidth / canvasHeight;
    let renderWidth, renderHeight, x, y;

    if (canvasRatio > imgRatio) {
      renderWidth = canvasWidth;
      renderHeight = canvasWidth / imgRatio;
      x = 0;
      y = (canvasHeight - renderHeight) / 2;
    } else {
      renderWidth = canvasHeight * imgRatio;
      renderHeight = canvasHeight;
      x = (canvasWidth - renderWidth) / 2;
      y = 0;
    }

    ctx.drawImage(img, x, y, renderWidth, renderHeight);
  }

  function renderVideoLoop() {
    currentProgress += (targetProgress - currentProgress) * 0.15;

    if (framesInside.length && framesOutside.length) {
      const indexInside = Math.min(
        Math.floor(currentProgress * framesInside.length),
        framesInside.length - 1
      );
      const indexOutside = Math.min(
        Math.floor(currentProgress * framesOutside.length),
        framesOutside.length - 1
      );

      const w = stageCanvas.width;
      const h = stageCanvas.height;

      // 1. Clear Stage
      stageCtx.clearRect(0, 0, w, h);

      // 2. Render Base Inside Layer
      drawImageCover(stageCtx, framesInside[indexInside], w, h);

      // 3. Render Outside Layer on Offscreen Mask Canvas
      maskCtx.clearRect(0, 0, w, h);
      drawImageCover(maskCtx, framesOutside[indexOutside], w, h);

      // Punch Halftone Mask Hole using Fluid Canvas
      maskCtx.globalCompositeOperation = "destination-out";
      maskCtx.drawImage(fluidCanvas, 0, 0, w, h);
      maskCtx.globalCompositeOperation = "source-over";

      // 4. Composite Masked Video onto Main Stage
      stageCtx.drawImage(maskCanvas, 0, 0, w, h);

      // 5. Draw Red Glowing Border
      glowCtx.clearRect(0, 0, w, h);

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const strokeColor = hexToRgba(styleSettings.borderColorHex, styleSettings.borderOpacity);

      glowCtx.save();
      glowCtx.shadowColor = hexToRgba(styleSettings.borderColorHex, styleSettings.borderOpacity);
      glowCtx.shadowBlur = styleSettings.glowRadius * dpr;

      glowCtx.drawImage(fluidCanvas, 0, 0, w, h);

      glowCtx.globalCompositeOperation = "source-in";
      glowCtx.fillStyle = strokeColor;
      glowCtx.fillRect(0, 0, w, h);

      glowCtx.shadowBlur = styleSettings.borderWidth * dpr;
      glowCtx.drawImage(fluidCanvas, 0, 0, w, h);
      glowCtx.restore();

      // 6. Composite Glowing Border onto Main Stage
      stageCtx.drawImage(glowCanvas, 0, 0, w, h);
    }

    requestAnimationFrame(renderVideoLoop);
  }

  /* =========================================================================
     SECTION 2: FLUID SIMULATION & SHADERS
     ========================================================================= */
  const VERT = [
    "varying vec2 vUv;",
    "void main () {",
    "  vUv = uv;",
    "  gl_Position = vec4(position.xy, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_SPLAT = [
    "uniform sampler2D uTarget;",
    "uniform float aspectRatio;",
    "uniform vec3 color;",
    "uniform vec2 point;",
    "uniform float radius;",
    "varying vec2 vUv;",
    "void main () {",
    "  vec2 p = vUv - point.xy;",
    "  p.x *= aspectRatio;",
    "  vec3 splat = exp(-dot(p, p) / radius) * color;",
    "  vec3 base = texture2D(uTarget, vUv).xyz;",
    "  gl_FragColor = vec4(base + splat, 1.0);",
    "}"
  ].join("\n");

  const FRAG_ADVECTION = [
    "uniform sampler2D uVelocity;",
    "uniform sampler2D uSource;",
    "uniform vec2 texelSize;",
    "uniform float dt;",
    "uniform float dissipation;",
    "varying vec2 vUv;",
    "void main () {",
    "  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;",
    "  vec4 result = texture2D(uSource, coord);",
    "  float decay = 1.0 + dissipation * dt;",
    "  gl_FragColor = result / decay;",
    "}"
  ].join("\n");

  const FRAG_DIVERGENCE = [
    "uniform sampler2D uVelocity;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).x;",
    "  float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).x;",
    "  float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).y;",
    "  float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).y;",
    "  float div = 0.5 * (R - L + T - B);",
    "  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_CURL = [
    "uniform sampler2D uVelocity;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).y;",
    "  float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).y;",
    "  float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).x;",
    "  float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).x;",
    "  float vorticity = R - L - T + B;",
    "  gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_VORTICITY = [
    "uniform sampler2D uVelocity;",
    "uniform sampler2D uCurl;",
    "uniform float curl;",
    "uniform float dt;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  float L = texture2D(uCurl, vUv - vec2(texelSize.x, 0.0)).x;",
    "  float R = texture2D(uCurl, vUv + vec2(texelSize.x, 0.0)).x;",
    "  float T = texture2D(uCurl, vUv + vec2(0.0, texelSize.y)).x;",
    "  float B = texture2D(uCurl, vUv - vec2(0.0, texelSize.y)).x;",
    "  float C = texture2D(uCurl, vUv).x;",
    "  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));",
    "  force /= length(force) + 0.0001;",
    "  force *= curl * C;",
    "  vec2 vel = texture2D(uVelocity, vUv).xy;",
    "  gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_PRESSURE = [
    "uniform sampler2D uPressure;",
    "uniform sampler2D uDivergence;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;",
    "  float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;",
    "  float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;",
    "  float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;",
    "  float divergence = texture2D(uDivergence, vUv).x;",
    "  float pressure = (L + R + B + T - divergence) * 0.25;",
    "  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_GRADIENT = [
    "uniform sampler2D uPressure;",
    "uniform sampler2D uVelocity;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;",
    "  float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;",
    "  float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;",
    "  float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;",
    "  vec2 velocity = texture2D(uVelocity, vUv).xy;",
    "  velocity -= vec2(R - L, T - B);",
    "  gl_FragColor = vec4(velocity, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_CLEAR = [
    "uniform sampler2D uTexture;",
    "uniform float value;",
    "varying vec2 vUv;",
    "void main () {",
    "  gl_FragColor = value * texture2D(uTexture, vUv);",
    "}"
  ].join("\n");

  const FRAG_BOUNDARY = [
    "uniform sampler2D uVelocity;",
    "uniform vec2 texelSize;",
    "varying vec2 vUv;",
    "void main () {",
    "  vec2 vel = texture2D(uVelocity, vUv).xy;",
    "  float edge = 0.02;",
    "  float dampX = smoothstep(0.0, edge, vUv.x) * smoothstep(1.0, 1.0 - edge, vUv.x);",
    "  float dampY = smoothstep(0.0, edge, vUv.y) * smoothstep(1.0, 1.0 - edge, vUv.y);",
    "  vel *= dampX * dampY;",
    "  gl_FragColor = vec4(vel, 0.0, 1.0);",
    "}"
  ].join("\n");

  const FRAG_DISPLAY = [
    "uniform sampler2D uTexture;",
    "uniform float threshold;",
    "uniform float softness;",
    "uniform float cellSize;",
    "uniform vec2 resolution;",
    "varying vec2 vUv;",
    "void main () {",
    "  vec3 c = texture2D(uTexture, vUv).rgb;",
    "  float intensity = max(c.r, max(c.g, c.b));",
    "  float mask = step(threshold, intensity);",
    "  vec2 pixel = vUv * resolution;",
    "  vec2 cell = floor(pixel / cellSize);",
    "  vec2 cellUV = (cell * cellSize + cellSize * 0.5) / resolution;",
    "  float ci = max(texture2D(uTexture, cellUV).r, max(texture2D(uTexture, cellUV).g, texture2D(uTexture, cellUV).b));",
    "  float dotRadius = ci * 0.52;",
    "  vec2 localUV = fract(pixel / cellSize) - 0.5;",
    "  float dist = length(localUV);",
    "  float dot = step(dist, dotRadius);",
    "  float alpha = dot * mask;",
    "  gl_FragColor = vec4(vec3(1.0), alpha);",
    "}"
  ].join("\n");

  function FluidSimulation(canvas, config) {
    this.canvas = canvas;
    this.config = config;
    this.pointers = [{ id: -1, x: 0.5, y: 0.5, dx: 0, dy: 0, moved: false }];
    this.lastTime = performance.now();
    this._setupRenderer();
    this._setupScene();
    this._setupTargets();
    this._setupMaterials();
    this._loop = this._loop.bind(this);
    this._resize = this._resize.bind(this);
    requestAnimationFrame(this._loop);
  }

  FluidSimulation.prototype._setupRenderer = function () {
    this.renderer = new THREE.WebGLRenderer({
      canvas: this.canvas,
      alpha: true,
      premultipliedAlpha: false,
      antialias: false,
      preserveDrawingBuffer: true
    });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.renderer.setPixelRatio(dpr);
    this.renderer.setSize(window.innerWidth, window.innerHeight, false);
    this.renderer.autoClear = false;
    this.texType = this.renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType;
  };

  FluidSimulation.prototype._setupScene = function () {
    this.scene = new THREE.Scene();
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial());
    this.scene.add(this.quad);
  };

  FluidSimulation.prototype._resolutionFor = function (resolution, aspect) {
    if (aspect > 1) return { w: Math.round(resolution), h: Math.round(resolution / aspect) };
    return { w: Math.round(resolution * aspect), h: Math.round(resolution) };
  };

  FluidSimulation.prototype._makeTarget = function (w, h) {
    return new THREE.WebGLRenderTarget(Math.max(w, 1), Math.max(h, 1), {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: this.texType,
      depthBuffer: false,
      stencilBuffer: false
    });
  };

  FluidSimulation.prototype._makeDoubleFBO = function (w, h) {
    var self = this;
    return {
      read: self._makeTarget(w, h),
      write: self._makeTarget(w, h),
      swap: function () {
        var tmp = this.read;
        this.read = this.write;
        this.write = tmp;
      }
    };
  };

  FluidSimulation.prototype._setupTargets = function () {
    var aspect = window.innerWidth / window.innerHeight;
    var sim = this._resolutionFor(this.config.simResolution, aspect);
    var dye = this._resolutionFor(this.config.dyeResolution, aspect);
    this.simWidth = sim.w; this.simHeight = sim.h;
    this.dyeWidth = dye.w; this.dyeHeight = dye.h;
    this.velocity = this._makeDoubleFBO(this.simWidth, this.simHeight);
    this.dye = this._makeDoubleFBO(this.dyeWidth, this.dyeHeight);
    this.divergenceTarget = this._makeTarget(this.simWidth, this.simHeight);
    this.curlTarget = this._makeTarget(this.simWidth, this.simHeight);
    this.pressure = this._makeDoubleFBO(this.simWidth, this.simHeight);
  };

  FluidSimulation.prototype._setupMaterials = function () {
    var common = { depthTest: false, depthWrite: false, blending: THREE.NoBlending };

    this.splatMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uTarget: { value: null },
        aspectRatio: { value: 1 },
        color: { value: new THREE.Vector3() },
        point: { value: new THREE.Vector2(0.5, 0.5) },
        radius: { value: this.config.splatRadius }
      },
      vertexShader: VERT, fragmentShader: FRAG_SPLAT
    }, common));

    this.advectionMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uVelocity: { value: null },
        uSource: { value: null },
        texelSize: { value: new THREE.Vector2() },
        dt: { value: 0.016 },
        dissipation: { value: 1.0 }
      },
      vertexShader: VERT, fragmentShader: FRAG_ADVECTION
    }, common));

    this.divergenceMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: { uVelocity: { value: null }, texelSize: { value: new THREE.Vector2() } },
      vertexShader: VERT, fragmentShader: FRAG_DIVERGENCE
    }, common));

    this.curlMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: { uVelocity: { value: null }, texelSize: { value: new THREE.Vector2() } },
      vertexShader: VERT, fragmentShader: FRAG_CURL
    }, common));

    this.vorticityMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uVelocity: { value: null },
        uCurl: { value: null },
        curl: { value: this.config.curl },
        dt: { value: 0.016 },
        texelSize: { value: new THREE.Vector2() }
      },
      vertexShader: VERT, fragmentShader: FRAG_VORTICITY
    }, common));

    this.pressureMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uPressure: { value: null },
        uDivergence: { value: null },
        texelSize: { value: new THREE.Vector2() }
      },
      vertexShader: VERT, fragmentShader: FRAG_PRESSURE
    }, common));

    this.gradientMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uPressure: { value: null },
        uVelocity: { value: null },
        texelSize: { value: new THREE.Vector2() }
      },
      vertexShader: VERT, fragmentShader: FRAG_GRADIENT
    }, common));

    this.clearMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: { uTexture: { value: null }, value: { value: this.config.pressureDecay } },
      vertexShader: VERT, fragmentShader: FRAG_CLEAR
    }, common));

    this.boundaryMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uVelocity: { value: null },
        texelSize: { value: new THREE.Vector2() }
      },
      vertexShader: VERT, fragmentShader: FRAG_BOUNDARY
    }, common));

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.displayMaterial = new THREE.ShaderMaterial(Object.assign({
      uniforms: {
        uTexture: { value: null },
        threshold: { value: styleSettings.threshold },
        softness: { value: this.config.softness },
        cellSize: { value: styleSettings.cellSize * dpr },
        resolution: { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) }
      },
      vertexShader: VERT, fragmentShader: FRAG_DISPLAY,
      transparent: true
    }, common));
  };

  FluidSimulation.prototype._correctDeltaX = function (delta) {
    var aspect = window.innerWidth / window.innerHeight;
    return aspect < 1 ? delta * aspect : delta;
  };

  FluidSimulation.prototype._correctDeltaY = function (delta) {
    var aspect = window.innerWidth / window.innerHeight;
    return aspect > 1 ? delta / aspect : delta;
  };

  FluidSimulation.prototype.onPointerMove = function (id, clientX, clientY) {
    var self = this;
    function findOrCreate(id) {
      for (var i = 0; i < self.pointers.length; i++) {
        if (self.pointers[i].id === id) return self.pointers[i];
      }
      var p = { id: id, x: 0.5, y: 0.5, dx: 0, dy: 0, moved: false };
      self.pointers.push(p);
      return p;
    }
    var x = clientX / window.innerWidth;
    var y = 1.0 - clientY / window.innerHeight;
    var p = findOrCreate(id);
    var dx = self._correctDeltaX(x - p.x);
    var dy = self._correctDeltaY(y - p.y);
    p.x = x; p.y = y;
    p.dx += dx; p.dy += dy;
    if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
      p.moved = true;
    }
  };

  FluidSimulation.prototype._pass = function (material, target) {
    this.quad.material = material;
    this.renderer.setRenderTarget(target);
    this.renderer.render(this.scene, this.camera);
  };

  FluidSimulation.prototype.splat = function (x, y, dx, dy, color) {
    var aspect = window.innerWidth / window.innerHeight;
    var u = this.splatMaterial.uniforms;
    u.uTarget.value = this.velocity.read.texture;
    u.aspectRatio.value = aspect;
    u.point.value.set(x, y);
    u.color.value.set(dx, dy, 0);
    u.radius.value = this.config.splatRadius;
    this._pass(this.splatMaterial, this.velocity.write);
    this.velocity.swap();
    u.uTarget.value = this.dye.read.texture;
    u.color.value.set(color[0], color[1], color[2]);
    this._pass(this.splatMaterial, this.dye.write);
    this.dye.swap();
  };

  FluidSimulation.prototype._applyInputs = function () {
    for (var i = 0; i < this.pointers.length; i++) {
      var p = this.pointers[i];
      if (p.moved) {
        this.splat(p.x, p.y, p.dx * this.config.forceStrength, p.dy * this.config.forceStrength, this.config.inkColor);
        p.dx = 0; p.dy = 0; p.moved = false;
      }
    }
  };

  FluidSimulation.prototype.simulate = function (dt) {
    var texelSize = new THREE.Vector2(1 / this.simWidth, 1 / this.simHeight);

    this.curlMaterial.uniforms.uVelocity.value = this.velocity.read.texture;
    this.curlMaterial.uniforms.texelSize.value = texelSize;
    this._pass(this.curlMaterial, this.curlTarget);

    var vu = this.vorticityMaterial.uniforms;
    vu.uVelocity.value = this.velocity.read.texture;
    vu.uCurl.value = this.curlTarget.texture;
    vu.curl.value = this.config.curl;
    vu.dt.value = dt;
    vu.texelSize.value = texelSize;
    this._pass(this.vorticityMaterial, this.velocity.write);
    this.velocity.swap();

    this.divergenceMaterial.uniforms.uVelocity.value = this.velocity.read.texture;
    this.divergenceMaterial.uniforms.texelSize.value = texelSize;
    this._pass(this.divergenceMaterial, this.divergenceTarget);

    this.clearMaterial.uniforms.uTexture.value = this.pressure.read.texture;
    this.clearMaterial.uniforms.value.value = this.config.pressureDecay;
    this._pass(this.clearMaterial, this.pressure.write);
    this.pressure.swap();

    var pu = this.pressureMaterial.uniforms;
    pu.uDivergence.value = this.divergenceTarget.texture;
    pu.texelSize.value = texelSize;
    for (var i = 0; i < this.config.pressureIterations; i++) {
      pu.uPressure.value = this.pressure.read.texture;
      this._pass(this.pressureMaterial, this.pressure.write);
      this.pressure.swap();
    }

    var gu = this.gradientMaterial.uniforms;
    gu.uPressure.value = this.pressure.read.texture;
    gu.uVelocity.value = this.velocity.read.texture;
    gu.texelSize.value = texelSize;
    this._pass(this.gradientMaterial, this.velocity.write);
    this.velocity.swap();

    this.boundaryMaterial.uniforms.uVelocity.value = this.velocity.read.texture;
    this.boundaryMaterial.uniforms.texelSize.value = texelSize;
    this._pass(this.boundaryMaterial, this.velocity.write);
    this.velocity.swap();

    var au = this.advectionMaterial.uniforms;
    au.uVelocity.value = this.velocity.read.texture;
    au.uSource.value = this.velocity.read.texture;
    au.texelSize.value = texelSize;
    au.dt.value = dt;
    au.dissipation.value = this.config.velocityDissipation;
    this._pass(this.advectionMaterial, this.velocity.write);
    this.velocity.swap();

    au.uVelocity.value = this.velocity.read.texture;
    au.uSource.value = this.dye.read.texture;
    au.dissipation.value = this.config.dyeDissipation;
    this._pass(this.advectionMaterial, this.dye.write);
    this.dye.swap();
  };

  FluidSimulation.prototype.render = function () {
    this.renderer.setRenderTarget(null);
    this.renderer.setClearColor(0x000000, 0);
    this.renderer.clear(true, false, false);
    var du = this.displayMaterial.uniforms;
    du.uTexture.value = this.dye.read.texture;
    du.threshold.value = styleSettings.threshold;
    du.softness.value = this.config.softness;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    du.cellSize.value = styleSettings.cellSize * dpr;
    du.resolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr);
    this._pass(this.displayMaterial, null);
  };

  FluidSimulation.prototype._resize = function () {
    this.renderer.setSize(window.innerWidth, window.innerHeight, false);
    [this.velocity.read, this.velocity.write, this.dye.read, this.dye.write,
     this.divergenceTarget, this.curlTarget, this.pressure.read, this.pressure.write]
      .forEach(function (t) { t.dispose(); });
    this._setupTargets();
  };

  FluidSimulation.prototype._loop = function () {
    var now = performance.now();
    var dt = Math.min((now - this.lastTime) / 1000, 0.0167);
    this.lastTime = now;
    this._applyInputs();
    this.simulate(dt);
    this.render();
    requestAnimationFrame(this._loop);
  };

  /* =========================================================================
     SECTION 3: INITIALIZATION & EVENTS
     ========================================================================= */
  const fluidConfig = {
    simResolution: 128,
    dyeResolution: 1024,
    curl: 60,
    pressureIterations: 47,
    velocityDissipation: 0.05,
    dyeDissipation: 2.9,
    splatRadius: 0.0020,
    forceStrength: 1000,
    pressureDecay: 0.10,
    softness: 0.0,
    inkColor: [1, 1, 1]
  };

  resizeAllCanvases();
  window.fluidSim = new FluidSimulation(fluidCanvas, fluidConfig);

  function handlePointerMove(clientX, clientY, pointerId = -1) {
    targetProgress = Math.min(Math.max(clientX / window.innerWidth, 0), 1);
    window.fluidSim.onPointerMove(pointerId, clientX, clientY);
  }

  window.addEventListener("mousemove", (e) => {
    handlePointerMove(e.clientX, e.clientY, -1);
  }, { passive: true });

  window.addEventListener("touchmove", (e) => {
    if (e.touches.length) {
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointerMove(t.clientX, t.clientY, t.identifier);
      }
    }
  }, { passive: true });

  async function init() {
    const v1 = document.createElement("video");
    const v2 = document.createElement("video");
    v1.src = "../static/assets/inside.webm";
    v2.src = "../static/assets/outside.webm";

    await Promise.all([
      new Promise((r) => { v1.onloadedmetadata = r; }),
      new Promise((r) => { v2.onloadedmetadata = r; })
    ]);

    totalFramesEstimate = Math.floor(v1.duration * EXTRACTION_FPS) + Math.floor(v2.duration * EXTRACTION_FPS);

    [framesInside, framesOutside] = await Promise.all([
      extractFrames("../static/assets/inside.webm"),
      extractFrames("../static/assets/outside.webm")
    ]);

    loader.style.display = "none";
    requestAnimationFrame(renderVideoLoop);
  }

  init().catch((err) => {
    console.error("Initialization failed:", err);
    loader.textContent = "Error loading assets.";
  });

  // CRT GRAIN
  (function(){
    const c=document.getElementById('crtGrain');
    if(!c)return;
    const ctx=c.getContext('2d');
    function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
    resize();
    window.addEventListener('resize',resize);
    function grain(){
      const w=c.width,h=c.height;
      const img=ctx.createImageData(w,h);
      const d=img.data;
      for(let i=0;i<d.length;i+=4){
        const v=Math.random()*255|0;
        d[i]=d[i+1]=d[i+2]=v;d[i+3]=18;
      }
      ctx.putImageData(img,0,0);
      requestAnimationFrame(grain);
    }
    grain();
  })();

})();
</script>
