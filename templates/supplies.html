<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Terminal — Supplies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='crt.css') }}">

    <style>
        /* ==========================================
     CUSTOM FONTS
     ========================================== */
        @font-face {
            font-family: 'FontspringDemo';
            src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-regular.otf') }}") format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'FontspringDemo';
            src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-bold.otf') }}") format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'FontspringDemo';
            src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-extrabold.otf') }}") format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'FontspringDemo';
            src: url("{{ url_for('static', filename='fonts/Fontspring-DEMO-integralcf-heavy.otf') }}") format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --red-glow: #ff0000;
            --red-dark: #b30000;
            --black: #000000;
            --dark-bg: #0d0d0d;
            --panel-border: #800000;
            --card-bg: #080808;
            --card-border: #2a2a2a;
            --text-red: #e60000;
            --text-muted: #808080;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'FontspringDemo', 'Orbitron', 'JetBrains Mono', sans-serif;
            min-height: 100vh;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ==========================================
     NAVBAR
     ========================================== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--panel-border);
            padding: 12px 24px;
            margin-bottom: 24px;
            background: #030303;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 4px var(--red-glow));
        }

        .nav-brand-text {
            display: flex;
            flex-direction: column;
        }

        .nav-title {
            color: var(--text-red);
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .nav-status {
            color: var(--text-red);
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.8;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background: var(--text-red);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--red-glow);
        }

        .nav-links {
            display: flex;
            gap: 48px;
        }

        .nav-links a {
            color: var(--text-red);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ff3333;
            text-shadow: 0 0 8px var(--red-glow);
        }

        /* ==========================================
     MAIN GRID CONTAINER
     ========================================== */
        .container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 24px;
            flex: 1;
        }

        /* ==========================================
     LEFT FEATURED PANEL
     ========================================== */
        .featured-panel {
            border: 1px solid var(--panel-border);
            background: #000000;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 580px;
        }

        .featured-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--white);
            text-transform: uppercase;
        }

        .points-badge {
            text-align: right;
        }

        .points-label {
            color: var(--text-red);
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .points-value {
            color: var(--text-red);
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        /* CAROUSEL ARROWS */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-red);
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            transition: text-shadow 0.2s;
        }

        .arrow:hover {
            text-shadow: 0 0 10px var(--red-glow);
        }

        .arrow-left {
            left: 20px;
        }

        .arrow-right {
            right: 20px;
        }

        /* ==========================================
     LIGHTSABER DISPLAY AREA
     ========================================== */
        .saber-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .saber-media-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Reference image loaded into canvas — canvas is invisible, video sits on top */
        .saber-hitbox {
            display: none;
        }

        /* Canvas overlay — invisible but captures mouse for alpha testing */
        .saber-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: auto;
            cursor: crosshair;
            z-index: 2;
        }

        /* Video sits directly behind the canvas, same scale */
        .saber-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
        }

        /* FEATURED FOOTER CONTROLS */
        .featured-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .carousel-dots {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #444;
            background: transparent;
            cursor: pointer;
        }

        .dot.active {
            background: var(--text-red);
            border-color: var(--text-red);
            box-shadow: 0 0 8px var(--red-glow);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 32px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-rent {
            background: #0a0a0a;
            border: 1px solid #333;
            color: var(--white);
        }

        .btn-rent:hover {
            border-color: #666;
        }

        .btn-purchase-lg {
            background: var(--text-red);
            border: none;
            color: var(--black);
            font-weight: 800;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
        }

        .btn-purchase-lg:hover {
            background: #ff1a1a;
            box-shadow: 0 0 18px var(--red-glow);
        }

        /* ==========================================
     RIGHT STORE MESH (GRID)
     ========================================== */
        .store-mesh {
            border: 1px solid var(--panel-border);
            background: #020202;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 12px;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .item-card:hover {
            border-color: var(--text-red);
            box-shadow: 0 0 18px rgba(230, 0, 0, 0.35);
        }

        /* TALL SPAN CARD */
        .item-card.span-tall {
            grid-column: span 2;
            grid-row: span 2;
        }

        .btn-card-buy {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 9px;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .item-card:hover .btn-card-buy {
            color: var(--white);
        }

        /* Responsive styling */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- CRT OVERLAY -->
    <div class="crt-overlay">
        <div class="crt-scanlines"></div>
        <canvas class="crt-grain" id="crtGrain"></canvas>
        <div class="crt-scanners">
            <span style="--dur:9s;  --del:0s;   --op:0.13;"></span>
            <span style="--dur:14s; --del:-5s;  --op:0.08;"></span>
            <span style="--dur:11s; --del:-2s;  --op:0.10;"></span>
        </div>
        <div class="crt-glow"></div>
    </div>
    <div class="crt-bevel"></div>

    <!-- TOP NAVBAR -->
    <div class="navbar">
        <div class="nav-brand">
            <svg class="nav-logo" viewBox="0 0 100 100" fill="var(--text-red)">
                <path d="M50 0 L60 35 L95 35 L67 55 L78 90 L50 70 L22 90 L33 55 L5 35 L40 35 Z" />
            </svg>
            <div class="nav-brand-text">
                <span class="nav-title">Imperial Network Command Centre</span>
                <span class="nav-status"><span class="status-dot"></span> active</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('announcements') }}">Announcements</a>
            <a href="{{ url_for('supplies') }}" class="active">Supplies</a>
            <a href="{{ url_for('sanitisation') }}">Sanitisation</a>
        </div>
    </div>

    <!-- MAIN CONTENT GRID -->
    <div class="container">

        <!-- LEFT FEATURED ITEM DISPLAY -->
        <div class="featured-panel">
            <div class="featured-header">
                <h1 class="item-title">LIGHT SABER</h1>
                <div class="points-badge">
                    <div class="points-label">Battle points</div>
                    <div class="points-value">23208</div>
                </div>
            </div>

            <!-- LIGHTSABER VIDEO + HITBOX -->
            <div class="saber-display">
                <div class="saber-media-wrapper">
                    <!-- Forward video -->
                    <video
                        id="saberVideo"
                        class="saber-video"
                        src="{{ url_for('static', filename='assets/tracery_1_720p.webm') }}"
                        preload="auto"
                        muted
                        playsinline
                    ></video>
                    <!-- Reversed video (pre-rendered), hidden by default -->
                    <video
                        id="saberVideoRev"
                        class="saber-video"
                        src="{{ url_for('static', filename='assets/tracery_1_720p_rev.webm') }}"
                        preload="auto"
                        muted
                        playsinline
                        style="display:none;"
                    ></video>
                    <!-- Hidden reference image for alpha sampling -->
                    <img
                        id="saberHitbox"
                        class="saber-hitbox"
                        src="{{ url_for('static', filename='assets/reference mouse.webp') }}"
                        alt=""
                        crossorigin="anonymous"
                        draggable="false"
                    />
                    <!-- Canvas: same size as image, invisible, used for pixel-perfect mouse tracking -->
                    <canvas id="saberCanvas" class="saber-canvas"></canvas>
                </div>
            </div>

            <!-- CAROUSEL ARROWS -->
            <span class="arrow arrow-left">&larr;</span>
            <span class="arrow arrow-right">&rarr;</span>

            <div class="featured-footer">
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-rent">Rent</button>
                    <button class="btn btn-purchase-lg">Apply</button>
                </div>
            </div>
        </div>

        <!-- RIGHT STORE INVENTORY GRID -->
        <div class="store-mesh">
            <!-- Row 1 -->
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>

            <!-- Row 2 -->
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>

            <!-- Row 3 -->
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>

            <!-- Row 4 -->
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>
            <div class="item-card">
                <button class="btn-card-buy">PURCHASE</button>
            </div>
        </div>

    </div>

    <script>
    (function () {
        const hitImg = document.getElementById('saberHitbox');
        const canvas = document.getElementById('saberCanvas');
        const ctx    = canvas.getContext('2d', { willReadFrequently: true });

        // ── 1. ALPHA MAP ──────────────────────────────────────────────────────
        let alphaReady = false;
        let imgW = 0, imgH = 0;

        // We size the canvas against the forward video element
        const refEl = document.getElementById('saberVideo');

        function buildAlphaMap() {
            imgW = hitImg.naturalWidth;
            imgH = hitImg.naturalHeight;
            canvas.width  = imgW;
            canvas.height = imgH;
            canvas.style.width  = refEl.offsetWidth  + 'px';
            canvas.style.height = refEl.offsetHeight + 'px';
            ctx.drawImage(hitImg, 0, 0, imgW, imgH);
            alphaReady = true;
        }

        if (hitImg.complete && hitImg.naturalWidth) {
            buildAlphaMap();
        } else {
            hitImg.addEventListener('load', buildAlphaMap);
        }

        window.addEventListener('resize', () => {
            if (!alphaReady) return;
            canvas.style.width  = refEl.offsetWidth  + 'px';
            canvas.style.height = refEl.offsetHeight + 'px';
        });

        // ── 2. ALPHA HIT TEST ─────────────────────────────────────────────────
        const ALPHA_THRESHOLD = 10;

        function isOnSaber(clientX, clientY) {
            if (!alphaReady) return false;
            const rect = canvas.getBoundingClientRect();
            const px = Math.round(((clientX - rect.left) / rect.width)  * imgW);
            const py = Math.round(((clientY - rect.top)  / rect.height) * imgH);
            if (px < 0 || py < 0 || px >= imgW || py >= imgH) return false;
            return ctx.getImageData(px, py, 1, 1).data[3] > ALPHA_THRESHOLD;
        }

        // ── 3. TWO VIDEOS ─────────────────────────────────────────────────────
        // vidFwd  — forward video, visible by default
        // vidRev  — pre-rendered reversed video, shown on mouse leave
        const vidFwd = document.getElementById('saberVideo');
        const vidRev = document.getElementById('saberVideoRev');

        function showFwd() {
            vidFwd.style.display = 'block';
            vidRev.style.display = 'none';
        }

        function showRev() {
            vidFwd.style.display = 'none';
            vidRev.style.display = 'block';
        }

        // ── 4. HOVER LOGIC ────────────────────────────────────────────────────
        let isHovered = false;

        canvas.addEventListener('mousemove', (e) => {
            const on = isOnSaber(e.clientX, e.clientY);
            canvas.style.cursor = on ? 'crosshair' : 'default';
            if (on && !isHovered)  { isHovered = true;  onEnter(); }
            if (!on && isHovered)  { isHovered = false; onLeave(); }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isHovered) { isHovered = false; onLeave(); }
        });

        function onEnter() {
            // Stop reverse, switch to forward from wherever it currently is
            vidRev.pause();
            // Sync forward to mirror position (rev plays 0→end = fwd plays end→0)
            const revPos = vidRev.currentTime;
            const dur    = vidFwd.duration || vidRev.duration || 0;
            vidFwd.currentTime = Math.max(0, dur - revPos);
            showFwd();
            if (vidFwd.currentTime < dur - 0.05) {
                vidFwd.play().catch(() => {});
            }
        }

        function onLeave() {
            // Stop forward, switch to reverse from mirrored position
            vidFwd.pause();
            const fwdPos = vidFwd.currentTime;
            const dur    = vidFwd.duration || vidRev.duration || 0;
            vidRev.currentTime = Math.max(0, dur - fwdPos);
            showRev();
            vidRev.play().catch(() => {});
        }

        // Hold at last frame when each video ends
        vidFwd.addEventListener('ended', () => vidFwd.pause());
        vidRev.addEventListener('ended', () => vidRev.pause());

        // Park both at frame 0 on load
        vidFwd.addEventListener('loadedmetadata', () => { vidFwd.currentTime = 0; });
        vidRev.addEventListener('loadedmetadata', () => { vidRev.currentTime = 0; });
    })();
    // CRT GRAIN
    (function(){
      const c=document.getElementById('crtGrain');
      if(!c)return;
      const ctx=c.getContext('2d');
      function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
      resize();
      window.addEventListener('resize',resize);
      function grain(){
        const w=c.width,h=c.height;
        const img=ctx.createImageData(w,h);
        const d=img.data;
        for(let i=0;i<d.length;i+=4){
          const v=Math.random()*255|0;
          d[i]=d[i+1]=d[i+2]=v;d[i+3]=18;
        }
        ctx.putImageData(img,0,0);
        requestAnimationFrame(grain);
      }
      grain();
    })();
    </script>
</body>

</html>
